<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apollyon</title>
  <link rel="icon" href="https://cdn.cgamz.online/apollyon-solid.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-pink: #ff006e;
      --magenta: #8338ec;
      --light-pink: #ffb3d6;
      --white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow: 0 8px 32px rgba(255, 0, 110, 0.1);
      --gradient-bg: linear-gradient(135deg, #ff006e 0%, #8338ec 50%, #3a86ff 100%);
      --gradient-card: linear-gradient(145deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--gradient-bg);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(131, 56, 236, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(58, 134, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 32px rgba(255, 0, 110, 0.2);
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 0.5rem;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.2rem;
      font-weight: 300;
    }

    .chat-container {
      background: var(--gradient-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .chat-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.8s ease;
    }

    .chat-container:hover::before {
      left: 100%;
    }

    #chat {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 1.5rem;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
      color: var(--white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 1.5rem;
    }

    #chat::-webkit-scrollbar {
      width: 8px;
    }

    #chat::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--primary-pink);
      border-radius: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #prompt {
      width: 100%;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--glass-border);
      border-radius: 15px;
      color: var(--white);
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      resize: vertical;
      min-height: 100px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #prompt:focus {
      outline: none;
      border-color: var(--primary-pink);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(255, 0, 110, 0.2);
    }

    #prompt::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #send {
      background: linear-gradient(45deg, var(--primary-pink), var(--magenta));
      color: var(--white);
      border: none;
      padding: 1rem 2rem;
      border-radius: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    #send:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 0, 110, 0.4);
    }

    #send:active {
      transform: translateY(0);
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      background: var(--gradient-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 1rem 1.5rem;
      color: var(--white);
      font-weight: 500;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid var(--primary-pink);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
      }
      to {
        text-shadow: 0 0 30px rgba(255, 0, 110, 0.8), 0 0 40px rgba(131, 56, 236, 0.3);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .chat-container {
        padding: 1.5rem;
      }

      #send {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="https://cdn.cgamz.online/apollyon-trans.png" alt="Apollyon Logo" class="logo">
    <h1>Apollyon</h1>
    <p class="subtitle">AI-powered conversations in your browser</p>
  </div>

  <div class="status" id="status">
    <div class="loading">
      <div class="spinner"></div>
      <span>Loading model...</span>
    </div>
  </div>

  <div class="chat-container">
    <pre id="chat"></pre>
    
    <div class="input-group">
      <textarea
        id="prompt"
        rows="4"
        placeholder="Ask me anything..."
      ></textarea>
      <button id="send">Send Message</button>
    </div>
  </div>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const chat = document.getElementById("chat");
const prompt = document.getElementById("prompt");
const send = document.getElementById("send");
const status = document.getElementById("status");

const engine = new webllm.MLCEngine();

engine.reload("Qwen3-0.6B-q4f16_1-MLC").then(() => {
  status.innerHTML = '<span style="color: #4ade80;">✓ Model loaded!</span>';
  setTimeout(() => {
    status.style.display = 'none';
  }, 2000);
});

send.onclick = async () => {
  const user = prompt.value.trim();
  if (!user) return;

  send.disabled = true;
  chat.textContent += "\n👤 You: " + user + "\n";
  prompt.value = "";

  const response = await engine.chat.completions.create({
    messages: [
      {
        role: "user",
        content: user,
      },
    ],
  });

  chat.textContent += "\n🤖 AI: " + response.choices[0].message.content + "\n";
  chat.scrollTop = chat.scrollHeight;
  send.disabled = false;
};

prompt.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.ctrlKey) {
    send.click();
  }
});
</script>

</body>
</html>
